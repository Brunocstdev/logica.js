<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Desconto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="exercicio">
        <h1>Calcular Desconto</h1>
        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01">
        <label for="desconto">Desconto (%):</label>
        <input type="number" id="desconto" step="0.01">
        <button id="calcular">Calcular</button>

        <p id="resultado" class="resultado">O resultado aparece aqui!</p>
    </main>
    <script src="./js/desconto.js"></script>
</body>
</html>
